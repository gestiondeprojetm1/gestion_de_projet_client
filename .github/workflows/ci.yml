# CI : exécutée à chaque Pull Request vers main et à chaque push sur main.
# Les jobs "tests", "secrets" et "build" sont les vérifications obligatoires
# de la protection de main. Publication GHCR, staging et production : partie 2.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements-dev.txt

      - name: Tests automatisés
        run: pytest -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique, pas seulement le dernier commit

      # CLI gitleaks (open source) plutôt que gitleaks-action : l'action exige
      # une licence payante pour les dépôts d'organisation. Version figée.
      - name: Scan des secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  build:
    runs-on: ubuntu-latest
    needs: [tests, secrets]
    steps:
      - uses: actions/checkout@v4

      - name: Calcul du SHA court
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"

      # Image taguée avec le SHA court, jamais "latest", et non publiée.
      # La version SemVer (vX.Y.Z) sera fournie par le tag Git en partie 2.
      - name: Build de l'image Docker
        run: |
          docker build \
            --build-arg APP_VERSION=dev \
            --build-arg GIT_SHA="$SHORT_SHA" \
            -t "gestion-api:$SHORT_SHA" .

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [tests, secrets, build]
    outputs:
      image_digest: ${{ steps.publish-image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extraire les métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/gestion-api
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et publication de l'image validée
        id: publish-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Générer le manifeste de déploiement
        shell: bash
        run: |
          mkdir -p release-artifact
          cat > release-artifact/deployment.env <<EOF
          IMAGE=ghcr.io/${{ github.repository }}/gestion-api@${{ steps.publish-image.outputs.digest }}
          VERSION=${{ github.ref_name }}
          GIT_SHA=${{ github.sha }}
          HEALTH_PATH=/health
          EOF

      - name: Publier le manifeste pour D2.2
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest-${{ github.ref_name }}
          path: release-artifact/deployment.env

  deploy-staging:
    name: Déploiement staging et smoke test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [publish]
    environment:
      name: staging
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}/gestion-api@${{ needs.publish.outputs.image_digest }}
      STAGING_TOKENS: ${{ secrets.STOCK_PRODUCER_TOKENS }}
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Créer le réseau staging isolé
        run: docker network create ci-staging-network

      - name: Démarrer PostgreSQL staging
        run: |
          docker run -d --name ci-staging-db \
            --network ci-staging-network \
            -e POSTGRES_USER=staging_user \
            -e POSTGRES_PASSWORD=staging_password \
            -e POSTGRES_DB=staging_db \
            postgres:16
          for attempt in {1..30}; do
            if docker exec ci-staging-db pg_isready -U staging_user -d staging_db; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Déployer l'image validée en staging
        run: |
          docker run -d --name ci-staging-api \
            --network ci-staging-network \
            -p 18000:8000 \
            -e DATABASE_URL="postgresql+psycopg://staging_user:staging_password@ci-staging-db:5432/staging_db" \
            -e APP_VERSION="${{ github.ref_name }}" \
            -e GIT_SHA="${{ github.sha }}" \
            -e STOCK_PRODUCER_TOKENS="$STAGING_TOKENS" \
            "$IMAGE"

      - name: Attendre et vérifier /health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18000/health | tee health.json; then
              test "$(jq -r .status health.json)" = "ok"
              test "$(jq -r .database health.json)" = "ok"
              exit 0
            fi
            sleep 2
          done
          docker logs ci-staging-api
          exit 1

      - name: Appliquer et rejouer la migration en staging
        run: docker exec ci-staging-api python scripts/migrate.py

      - name: Smoke test après migration
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18000/health | jq -e '.status == "ok" and .database == "ok"'

      - name: Nettoyer le staging éphémère
        if: always()
        run: |
          docker rm -f ci-staging-api ci-staging-db || true
          docker network rm ci-staging-network || true
