# CI : exécutée à chaque Pull Request vers main et à chaque push sur main.
# Les jobs "tests", "secrets" et "build" sont les vérifications obligatoires
# de la protection de main. Publication GHCR, staging et production : partie 2.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements-dev.txt

      - name: Tests automatisés
        run: pytest -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tout l'historique, pas seulement le dernier commit

      # CLI gitleaks (open source) plutôt que gitleaks-action : l'action exige
      # une licence payante pour les dépôts d'organisation. Version figée.
      - name: Scan des secrets (gitleaks)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  build:
    runs-on: ubuntu-latest
    needs: [tests, secrets]
    steps:
      - uses: actions/checkout@v4

      - name: Calcul du SHA court
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"

      # Image taguée avec le SHA court, jamais "latest", et non publiée.
      # La version SemVer (vX.Y.Z) sera fournie par le tag Git en partie 2.
      - name: Build de l'image Docker
        run: |
          docker build \
            --build-arg APP_VERSION=dev \
            --build-arg GIT_SHA="$SHORT_SHA" \
            -t "gestion-api:$SHORT_SHA" .
